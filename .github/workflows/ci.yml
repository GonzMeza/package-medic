name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  action-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test GitHub Action helpers and metadata
        run: node --test action/tests/lib.test.mjs action/tests/metadata.test.mjs action/tests/release.test.mjs

  native-mtp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore PackageMedic.sln --locked-mode
      - name: Verify native Microsoft Testing Platform end to end
        run: dotnet test tests/PackageMedic.IntegrationTests/PackageMedic.IntegrationTests.csproj --configuration Release --no-restore --filter FullyQualifiedName~VerifiedDiffRunsNativeMicrosoftTestingPlatformWithDotNet10
        env:
          PACKAGEMEDIC_REQUIRE_NATIVE_MTP_E2E: 'true'

  build-test-pack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore PackageMedic.sln --locked-mode
      - run: dotnet build PackageMedic.sln --configuration Release --no-restore
      - run: dotnet test PackageMedic.sln --configuration Release --no-build --no-restore
      - name: Audit the repository dependency graph
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project src/PackageMedic.Cli/PackageMedic.Cli.csproj --configuration Release --no-build -- audit PackageMedic.sln --no-restore --deprecated --include-transitive-audit --fail-on warning --verbosity quiet
      - name: Validate CycloneDX 1.7 output with the official CLI
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/PackageMedic.Cli/PackageMedic.Cli.csproj --configuration Release --no-build -- \
            sbom tests/PackageMedic.Core.Tests --output artifacts/packagemedic.cdx.json --no-restore --verbosity quiet
          mkdir -p artifacts/tools
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output artifacts/tools/cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64
          echo 'bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746  artifacts/tools/cyclonedx' | sha256sum --check --strict
          chmod 0755 artifacts/tools/cyclonedx
          artifacts/tools/cyclonedx validate \
            --input-file artifacts/packagemedic.cdx.json \
            --input-format json \
            --input-version v1_7 \
            --fail-on-errors
      - run: dotnet pack src/PackageMedic.Cli/PackageMedic.Cli.csproj --configuration Release --no-build --no-restore --output artifacts/packages
      - name: Read package version
        id: package-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Smoke-test local GitHub Action
        id: action-smoke
        uses: ./
        with:
          path: fixtures/clean
          mode: scan
          tool-version: ${{ steps.package-version.outputs.version }}
          nuget-source: ${{ github.workspace }}/artifacts/packages
          restore: 'false'
          fail-on: none
          annotations: 'false'
          upload-sarif: 'false'
          upload-artifact: 'false'
      - name: Verify Action reports
        run: node action/verify-smoke.mjs
        env:
          PACKAGEMEDIC_EXIT_CODE: ${{ steps.action-smoke.outputs.exit-code }}
          PACKAGEMEDIC_JSON_FILE: ${{ steps.action-smoke.outputs.json-file }}
          PACKAGEMEDIC_SARIF_FILE: ${{ steps.action-smoke.outputs.sarif-file }}
          PACKAGEMEDIC_ERRORS: ${{ steps.action-smoke.outputs.errors }}
          PACKAGEMEDIC_WARNINGS: ${{ steps.action-smoke.outputs.warnings }}
      - name: Smoke-test local GitHub Action diff mode
        id: action-diff-smoke
        uses: ./
        with:
          path: fixtures/clean
          tool-version: ${{ steps.package-version.outputs.version }}
          nuget-source: ${{ github.workspace }}/artifacts/packages
          restore: 'false'
          diff-base: HEAD
          fail-on: none
          annotations: 'false'
          upload-sarif: 'false'
          upload-artifact: 'false'
      - name: Verify Action diff reports
        run: node action/verify-smoke.mjs
        env:
          PACKAGEMEDIC_EXIT_CODE: ${{ steps.action-diff-smoke.outputs.exit-code }}
          PACKAGEMEDIC_JSON_FILE: ${{ steps.action-diff-smoke.outputs.json-file }}
          PACKAGEMEDIC_SARIF_FILE: ${{ steps.action-diff-smoke.outputs.sarif-file }}
          PACKAGEMEDIC_ERRORS: ${{ steps.action-diff-smoke.outputs.errors }}
          PACKAGEMEDIC_WARNINGS: ${{ steps.action-diff-smoke.outputs.warnings }}
      - name: Smoke-test verified Action restore mode
        id: action-verified-smoke
        uses: ./
        with:
          path: fixtures/verified/Verified.csproj
          tool-version: ${{ steps.package-version.outputs.version }}
          nuget-source: ${{ github.workspace }}/artifacts/packages
          restore: 'true'
          diff-base: HEAD
          verify: restore
          fail-on: none
          annotations: 'false'
          upload-sarif: 'false'
          upload-artifact: 'false'
      - name: Verify Action verification evidence
        run: node action/verify-verified-smoke.mjs
        env:
          PACKAGEMEDIC_EXIT_CODE: ${{ steps.action-verified-smoke.outputs.exit-code }}
          PACKAGEMEDIC_VERIFICATION_STATUS: ${{ steps.action-verified-smoke.outputs.verification-status }}
          PACKAGEMEDIC_VERIFICATION_INCOMPLETE: ${{ steps.action-verified-smoke.outputs.verification-incomplete }}
          PACKAGEMEDIC_SBOM_CREATED: ${{ steps.action-verified-smoke.outputs.sbom-created }}
          PACKAGEMEDIC_PROVENANCE_CREATED: ${{ steps.action-verified-smoke.outputs.provenance-created }}
          PACKAGEMEDIC_SBOM_FILE: ${{ steps.action-verified-smoke.outputs.sbom-file }}
          PACKAGEMEDIC_PROVENANCE_FILE: ${{ steps.action-verified-smoke.outputs.provenance-file }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: PackageMedic.Tool
          path: artifacts/packages/*.nupkg
