name: PackageMedic
description: Diagnose NuGet dependency health and publish CI-friendly annotations and SARIF.
author: GonzMeza

branding:
  icon: activity
  color: blue

inputs:
  path:
    description: Repository-relative project, solution, or directory to analyze.
    required: false
    default: .
  tool-version:
    description: Exact PackageMedic.Tool NuGet version to install (wildcards are rejected).
    required: false
    default: 0.6.0
  dotnet-version:
    description: .NET SDK version used to install and run PackageMedic.
    required: false
    default: 8.0.x
  nuget-source:
    description: HTTPS feed or trusted local directory used exclusively to install PackageMedic.Tool.
    required: false
    default: https://api.nuget.org/v3/index.json
  restore:
    description: Run dotnet restore before analysis.
    required: false
    default: 'true'
  fail-on:
    description: Optional severity threshold; when unset, configuration or the CLI default applies.
    required: false
    default: ''
  fail-on-new:
    description: Optional severity threshold applied only to diagnostics classified as new.
    required: false
    default: ''
  config:
    description: Optional repository-relative PackageMedic configuration file.
    required: false
    default: ''
  baseline:
    description: Optional repository-relative PackageMedic baseline file.
    required: false
    default: ''
  mode:
    description: Analysis mode (auto selects diff for unprivileged pull_request events and scan otherwise; pull_request_target is rejected).
    required: false
    default: auto
  audit:
    description: Audit resolved packages for known vulnerabilities and emit PM007 diagnostics.
    required: false
    default: 'false'
  include-transitive-audit:
    description: Include transitive packages when vulnerability auditing is enabled.
    required: false
    default: 'true'
  deprecated:
    description: Audit resolved packages for NuGet deprecation metadata and emit PM008 diagnostics.
    required: false
    default: 'false'
  include-transitive-deprecated:
    description: Include transitive packages when deprecation auditing is enabled.
    required: false
    default: 'false'
  diff-base:
    description: Optional Git reference to compare with the checked-out dependency graph; overrides mode.
    required: false
    default: ''
  verify:
    description: Optional immutable diff verification level (restore, build, or test). Build/test execute repository-controlled code.
    required: false
    default: ''
  build-timeout:
    description: Optional per-build-target verification timeout in seconds (1-3600).
    required: false
    default: ''
  test-timeout:
    description: Optional per-test-project verification timeout in seconds (1-3600).
    required: false
    default: ''
  verification-configuration:
    description: Build configuration used by verified build and test stages.
    required: false
    default: Release
  allow-self-hosted-verification:
    description: Explicitly permit build/test verification on a separately secured self-hosted runner.
    required: false
    default: 'false'
  verbosity:
    description: PackageMedic progress verbosity (quiet, normal, or detailed).
    required: false
    default: normal
  max-parallelism:
    description: Optional maximum concurrent restore, audit, and MSBuild processes (1-32).
    required: false
    default: ''
  annotations:
    description: Emit annotations for new or all diagnostics, or none; true/all and false/none are equivalent.
    required: false
    default: new
  upload-sarif:
    description: Upload SARIF to GitHub code scanning when the repository permits it.
    required: false
    default: 'true'
  upload-artifact:
    description: Upload JSON and SARIF reports as a workflow artifact.
    required: false
    default: 'true'
  artifact-name:
    description: Safe base name for the report artifact; a per-invocation suffix is added.
    required: false
    default: packagemedic-report
  category:
    description: Safe Code Scanning category base; a per-invocation suffix is added.
    required: false
    default: packagemedic
  output-directory:
    description: Existing base directory inside GITHUB_WORKSPACE or RUNNER_TEMP for an isolated report folder.
    required: false
    default: ''

outputs:
  exit-code:
    description: PackageMedic exit code (0 clean, 1 threshold reached, 2 operational error).
    value: ${{ steps.scan.outputs.exit-code }}
  json-file:
    description: Absolute path to the JSON report.
    value: ${{ steps.scan.outputs.json-file }}
  sarif-file:
    description: Absolute path to the SARIF report.
    value: ${{ steps.scan.outputs.sarif-file }}
  sbom-file:
    description: Absolute path to the deterministic CycloneDX 1.7 report.
    value: ${{ steps.scan.outputs.sbom-file }}
  provenance-file:
    description: Absolute path to unsigned in-toto analysis evidence; created only for completed verified diffs.
    value: ${{ steps.scan.outputs.provenance-file }}
  errors:
    description: Number of error diagnostics.
    value: ${{ steps.scan.outputs.errors }}
  warnings:
    description: Number of warning diagnostics.
    value: ${{ steps.scan.outputs.warnings }}
  information:
    description: Number of informational diagnostics.
    value: ${{ steps.scan.outputs.information }}
  findings-added:
    description: Number of diagnostics introduced by a diff analysis.
    value: ${{ steps.scan.outputs.findings-added }}
  findings-resolved:
    description: Number of diagnostics resolved by a diff analysis.
    value: ${{ steps.scan.outputs.findings-resolved }}
  severity-changed:
    description: Number of persistent diagnostics whose severity changed.
    value: ${{ steps.scan.outputs.severity-changed }}
  packages-added:
    description: Number of packages added by a diff analysis.
    value: ${{ steps.scan.outputs.packages-added }}
  packages-removed:
    description: Number of packages removed by a diff analysis.
    value: ${{ steps.scan.outputs.packages-removed }}
  packages-upgraded:
    description: Number of comparable package upgrades in a diff analysis.
    value: ${{ steps.scan.outputs.packages-upgraded }}
  packages-downgraded:
    description: Number of comparable package downgrades in a diff analysis.
    value: ${{ steps.scan.outputs.packages-downgraded }}
  uncomparable-version-changes:
    description: Number of changed package versions that could not be ordered safely.
    value: ${{ steps.scan.outputs.uncomparable-version-changes }}
  direct-to-transitive:
    description: Number of packages that changed from direct to transitive.
    value: ${{ steps.scan.outputs.direct-to-transitive }}
  transitive-to-direct:
    description: Number of packages that changed from transitive to direct.
    value: ${{ steps.scan.outputs.transitive-to-direct }}
  cpm-changes:
    description: Number of project Central Package Management setting changes.
    value: ${{ steps.scan.outputs.cpm-changes }}
  vulnerabilities-introduced:
    description: Number of PM007 findings introduced by a diff analysis.
    value: ${{ steps.scan.outputs.vulnerabilities-introduced }}
  vulnerabilities-resolved:
    description: Number of PM007 findings resolved by a diff analysis.
    value: ${{ steps.scan.outputs.vulnerabilities-resolved }}
  vulnerabilities-persistent:
    description: Number of PM007 findings that remain present across a diff analysis.
    value: ${{ steps.scan.outputs.vulnerabilities-persistent }}
  deprecations-introduced:
    description: Number of PM008 findings introduced by a diff analysis.
    value: ${{ steps.scan.outputs.deprecations-introduced }}
  deprecations-resolved:
    description: Number of PM008 findings resolved by a diff analysis.
    value: ${{ steps.scan.outputs.deprecations-resolved }}
  deprecations-persistent:
    description: Number of PM008 findings that remain present across a diff analysis.
    value: ${{ steps.scan.outputs.deprecations-persistent }}
  impact-gate-passed:
    description: Whether the dependency Impact Gate passed; empty when no impact comparison was evaluated.
    value: ${{ steps.scan.outputs.impact-gate-passed }}
  impact-violations:
    description: Number of dependency Impact Gate policy violations.
    value: ${{ steps.scan.outputs.impact-violations }}
  impact-added-direct:
    description: Number of direct packages added in the dependency impact comparison.
    value: ${{ steps.scan.outputs.impact-added-direct }}
  impact-added-transitive:
    description: Number of transitive packages added in the dependency impact comparison.
    value: ${{ steps.scan.outputs.impact-added-transitive }}
  impact-max-blast-radius:
    description: Largest number of changed transitive packages attributed to one direct dependency.
    value: ${{ steps.scan.outputs.impact-max-blast-radius }}
  impact-source-changes:
    description: Number of package source changes found by the dependency impact comparison.
    value: ${{ steps.scan.outputs.impact-source-changes }}
  impact-content-changes:
    description: Number of same-version packages whose restored content hash changed.
    value: ${{ steps.scan.outputs.impact-content-changes }}
  verification-status:
    description: Verification verdict (pass, reject, noChange, or incomplete); empty when not requested.
    value: ${{ steps.scan.outputs.verification-status }}
  build-regression:
    description: Whether the candidate introduced a build failure after a passing baseline.
    value: ${{ steps.scan.outputs.build-regression }}
  test-regression:
    description: Whether the candidate introduced a test failure after a passing baseline.
    value: ${{ steps.scan.outputs.test-regression }}
  tests-passed:
    description: Candidate tests reported as passed by bounded structured evidence.
    value: ${{ steps.scan.outputs.tests-passed }}
  tests-failed:
    description: Candidate tests reported as failed by bounded structured evidence.
    value: ${{ steps.scan.outputs.tests-failed }}
  tests-skipped:
    description: Candidate tests reported as skipped by bounded structured evidence.
    value: ${{ steps.scan.outputs.tests-skipped }}
  verification-incomplete:
    description: Whether requested verification could not produce reliable comparative evidence.
    value: ${{ steps.scan.outputs.verification-incomplete }}
  provenance-created:
    description: Whether unsigned in-toto evidence was created for this verified diff.
    value: ${{ steps.scan.outputs.provenance-created }}
  sbom-created:
    description: Whether deterministic CycloneDX evidence was created for this analysis.
    value: ${{ steps.scan.outputs.sbom-created }}
  artifact-name:
    description: Isolated artifact name generated for this invocation.
    value: ${{ steps.scan.outputs.artifact-name }}
  sarif-category:
    description: Isolated Code Scanning category generated for this invocation.
    value: ${{ steps.scan.outputs.sarif-category }}

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Run PackageMedic
      id: scan
      continue-on-error: true
      shell: bash
      run: node "$GITHUB_ACTION_PATH/action/run.mjs"
      env:
        PACKAGEMEDIC_PATH: ${{ inputs.path }}
        PACKAGEMEDIC_TOOL_VERSION: ${{ inputs.tool-version }}
        PACKAGEMEDIC_NUGET_SOURCE: ${{ inputs.nuget-source }}
        PACKAGEMEDIC_RESTORE: ${{ inputs.restore }}
        PACKAGEMEDIC_FAIL_ON: ${{ inputs.fail-on }}
        PACKAGEMEDIC_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        PACKAGEMEDIC_CONFIG: ${{ inputs.config }}
        PACKAGEMEDIC_BASELINE: ${{ inputs.baseline }}
        PACKAGEMEDIC_MODE: ${{ inputs.mode }}
        PACKAGEMEDIC_AUDIT: ${{ inputs.audit }}
        PACKAGEMEDIC_INCLUDE_TRANSITIVE_AUDIT: ${{ inputs.include-transitive-audit }}
        PACKAGEMEDIC_DEPRECATED: ${{ inputs.deprecated }}
        PACKAGEMEDIC_INCLUDE_TRANSITIVE_DEPRECATED: ${{ inputs.include-transitive-deprecated }}
        PACKAGEMEDIC_DIFF_BASE: ${{ inputs.diff-base }}
        PACKAGEMEDIC_VERIFY: ${{ inputs.verify }}
        PACKAGEMEDIC_BUILD_TIMEOUT: ${{ inputs.build-timeout }}
        PACKAGEMEDIC_TEST_TIMEOUT: ${{ inputs.test-timeout }}
        PACKAGEMEDIC_VERIFICATION_CONFIGURATION: ${{ inputs.verification-configuration }}
        PACKAGEMEDIC_ALLOW_SELF_HOSTED_VERIFICATION: ${{ inputs.allow-self-hosted-verification }}
        PACKAGEMEDIC_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        PACKAGEMEDIC_GITHUB_EVENT_NAME: ${{ github.event_name }}
        PACKAGEMEDIC_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PACKAGEMEDIC_VERBOSITY: ${{ inputs.verbosity }}
        PACKAGEMEDIC_MAX_PARALLELISM: ${{ inputs.max-parallelism }}
        PACKAGEMEDIC_ANNOTATIONS: ${{ inputs.annotations }}
        PACKAGEMEDIC_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        PACKAGEMEDIC_UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
        PACKAGEMEDIC_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        PACKAGEMEDIC_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        PACKAGEMEDIC_CATEGORY: ${{ inputs.category }}
        PACKAGEMEDIC_ACTION_INSTANCE: ${{ github.action }}

    - name: Upload SARIF
      id: upload-sarif
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif-created == 'true' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@bce182f857edf1feab116e9795a3393d21977282 # v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: ${{ steps.scan.outputs.sarif-category }}

    - name: Report unavailable code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.upload-sarif.outcome == 'failure' }}
      shell: bash
      run: echo "::warning title=PackageMedic SARIF upload::The scan completed, but GitHub could not accept the SARIF report. Check security-events permission and Code Security availability."

    - name: Upload reports
      if: ${{ always() && inputs.upload-artifact == 'true' && steps.scan.outputs.report-created == 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ steps.scan.outputs.artifact-name }}
        path: |
          ${{ steps.scan.outputs.json-file }}
          ${{ steps.scan.outputs.sarif-file }}
          ${{ steps.scan.outputs.sbom-file }}
          ${{ steps.scan.outputs.provenance-file }}
        if-no-files-found: warn
        retention-days: 14

    - name: Complete PackageMedic check
      if: ${{ always() }}
      shell: bash
      run: node "$GITHUB_ACTION_PATH/action/finalize.mjs"
      env:
        PACKAGEMEDIC_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
